        function parseCSV(text) {
            const lines = text.trim().split(/\r?\n/);
            if (lines.length < 2) return [];
            const headers = lines[0].split(',').map(h => h.trim());
            const data = [];

            for (let i = 1; i < lines.length; i++) {
                const line = lines[i].trim();
                if (!line) continue;
                
                const row = [];
                let inQuote = false;
                let current = '';
                for (let ch of line) {
                    if (ch === '"') {
                        inQuote = !inQuote;
                    } else if (ch === ',' && !inQuote) {
                        row.push(current.trim());
                        current = '';
                    } else {
                        current += ch;
                    }
                }
                row.push(current.trim());

                const item = {};
                headers.forEach((h, idx) => {
                    item[h] = row[idx] ? row[idx].replace(/^"|"$/g, '') : '';
                });
                data.push(item);
            }
            return data;
        }

        function renderCards(cards) {
            const grid = document.getElementById('cardsGrid');

            let totalCopies = 0;

                const count = parseInt(card.count || 1);
                totalCopies += count;

                for (let k = 0; k < count; k++) {
                    const cardEl = document.createElement('div');
                    const cardType = card.type || card.deck_type || 'default';
                    cardEl.className = `card-frame card-type-${cardType}`;
                    const typeClass = 'type-' + cardType;

                    let costLabel = card.capacity ? `容 ${card.capacity}` : (card.cost && card.cost !== '0' ? `虔誠 ${card.cost}` : (cardType === '角色' ? `信仰` : `即發`));

                    cardEl.innerHTML = `
                        <div class="card-header">
                            <div class="card-cost">${costLabel}</div>
                            <div class="card-name" title="${card.name}">${card.name}</div>
                            <span class="card-badge ${typeClass}">${card.type || card.deck_type || '卡牌'}</span>
                        </div>
                        <div class="card-image-slot">
                            [ ${card.name} 插圖區 ]
                        </div>
                        <div class="card-content-box">
                            <div class="card-effect">${card.description || ''}</div>
                            ${card.flavor_text ? `<div class="card-flavor">${card.flavor_text}</div>` : ''}
                        </div>
                        <div class="card-footer">
                            <span>ID: ${card.id || ''} (${k + 1}/${count})</span>
                            <span class="card-vp">${card.bound_pillar ? card.bound_pillar : (card.vp && card.vp !== '0' ? `靈力: ${card.vp}` : '常規')}</span>
                        </div>
                    `;
                    grid.appendChild(cardEl);
                }
            });

            document.getElementById('statsBar').innerText = 
                `總種類: ${cards.length} 種 | 列印總張數: ${totalCopies} 張 (約 ${Math.ceil(totalCopies / 9)} 頁 A4)`;
        }

        function loadSampleCards() {
            const cards = parseCSV(defaultCsv);
            renderCards(cards);
        }

        document.getElementById('csvFileInput').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(evt) {
                const text = evt.target.result;
                const cards = parseCSV(text);
                renderCards(cards);
            };
            reader.readAsText(file, 'UTF-8');
        });

        loadSampleCards();
    </script>
</body>
</html>
